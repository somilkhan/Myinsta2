name: Build patches

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morphe-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Audit stripped-runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'FreeRegisterProviderKt|registersUsed|BytecodeUtilsKt|BytecodeUtils' patches/src/main/kotlin; then
            echo 'Forbidden stripped-runtime helper dependency detected.' >&2
            exit 1
          fi

      - name: Build Morphe bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle buildAndroid --stacktrace

      - name: Prepare stable bundle name
        if: github.event_name != 'pull_request'
        run: cp patches/build/libs/*.mpp myinsta2.mpp

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: myinsta2-morphe-patches
          path: patches/build/libs/*.mpp
          if-no-files-found: error

      - name: Publish latest Morphe bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest myinsta2.mpp \
            --target "$GITHUB_SHA" \
            --title "MyInsta2 latest" \
            --notes "Latest Morphe patch bundle for Instagram 445.0.0.45.83."

name: Build patches

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: morphe-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Audit stripped-runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'FreeRegisterProviderKt|registersUsed|BytecodeUtilsKt|BytecodeUtils' patches/src/main/kotlin; then
            echo 'Forbidden stripped-runtime helper dependency detected.' >&2
            exit 1
          fi

      - name: Audit runtime extension wiring
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if ! grep -Fq 'extendWith("extensions/myinsta.mpe")' "$file"; then
              echo "Patch references a MyInsta2 runtime extension but does not attach extensions/myinsta.mpe: $file" >&2
              exit 1
            fi
          done < <(grep -RIlz 'Ldev/zehen/myinsta2/extension/' patches/src/main/kotlin --include='*.kt')

      - name: Build Morphe bundle
        run: gradle buildAndroid --stacktrace

      - name: Validate Morphe bundle contents
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(patches/build/libs/*.mpp)
          if (( ${#bundles[@]} != 1 )); then
            echo "Expected exactly one MPP bundle, found ${#bundles[@]}." >&2
            printf '%s\n' "${bundles[@]}" >&2
            exit 1
          fi
          bundle="${bundles[0]}"
          echo "Bundle: $bundle"
          sha256sum "$bundle"
          unzip -tq "$bundle"

          strings "$bundle" > "$RUNNER_TEMP/mpp-strings.txt"
          if grep -nE 'FreeRegisterProviderKt|registersUsed|BytecodeUtilsKt|BytecodeUtils' "$RUNNER_TEMP/mpp-strings.txt"; then
            echo 'Forbidden stripped-runtime helper leaked into the MPP bundle.' >&2
            exit 1
          fi

          if ! unzip -l "$bundle" | grep -Fq 'extensions/myinsta.mpe'; then
            echo 'MyInsta2 runtime extension is missing from the MPP bundle.' >&2
            exit 1
          fi

          unzip -p "$bundle" extensions/myinsta.mpe | strings > "$RUNNER_TEMP/extension-strings.txt"
          for class_fragment in \
            'dev/zehen/myinsta2/extension/Links' \
            'dev/zehen/myinsta2/extension/Block' \
            'dev/zehen/myinsta2/extension/FeedButton' \
            'dev/zehen/myinsta2/extension/CommentCopyUtils' \
            'dev/zehen/myinsta2/extension/MessageUtils' \
            'dev/zehen/myinsta2/extension/MyInstaChangelogProvider' \
            'dev/zehen/myinsta2/extension/MyInstaSettingsEntryPoint' \
            'dev/zehen/myinsta2/extension/MyInstaSettingsActivity'; do
            if ! grep -Fq "$class_fragment" "$RUNNER_TEMP/extension-strings.txt"; then
              echo "Expected runtime extension class missing from MPE: $class_fragment" >&2
              exit 1
            fi
          done

          for class_fragment in \
            'MyInsta2Kt' \
            'GhostModePatchKt' \
            'HideAdsPatchKt' \
            'DisableStoryAutoFlipPatchKt'; do
            if ! grep -Fq "$class_fragment" "$RUNNER_TEMP/mpp-strings.txt"; then
              echo "Expected production patch class missing from bundle: $class_fragment" >&2
              exit 1
            fi
          done

          if grep -Fq 'ViewStoriesAnonymouslyPatchKt' "$RUNNER_TEMP/mpp-strings.txt"; then
            echo 'Opt-in story-anonymity patch is present in the bundle, as expected.'
          fi

          manifest="$(unzip -p "$bundle" META-INF/MANIFEST.MF)"
          echo "$manifest"
          grep -Eq '^Version: [0-9]+\\.[0-9]+\\.[0-9]+' <<<"$manifest" || {
            echo 'MPP manifest has no valid semantic Version.' >&2
            exit 1
          }
          grep -Eq '^Patcher-Version: [0-9]+\\.[0-9]+\\.[0-9]+' <<<"$manifest" || {
            echo 'MPP manifest has no valid Patcher-Version.' >&2
            exit 1
          }

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: myinsta2-morphe-patches
          path: patches/build/libs/*.mpp
          if-no-files-found: error

name: Release

on:
  workflow_dispatch:
  push:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate published release bundle
        if: steps.release.outputs.new_release_published == 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.new_release_version }}
        run: |
          set -euo pipefail
          asset="patches-${RELEASE_VERSION}.mpp"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${RELEASE_VERSION}/${asset}"
          tmp="${RUNNER_TEMP}/${asset}"
          curl --fail --location --retry 3 --retry-all-errors --silent --show-error "$url" -o "$tmp"
          test -s "$tmp"
          unzip -tq "$tmp"
          manifest="$(unzip -p "$tmp" META-INF/MANIFEST.MF)"
          echo "$manifest"
          grep -Fq "Version: ${RELEASE_VERSION}" <<<"$manifest" || {
            echo "Published MPP manifest version does not match release ${RELEASE_VERSION}." >&2
            exit 1
          }
          grep -Eq '^Patcher-Version: [0-9]+\.[0-9]+\.[0-9]+' <<<"$manifest" || {
            echo 'Published MPP has no valid Patcher-Version.' >&2
            exit 1
          }
          unzip -l "$tmp" | grep -Fq 'extensions/myinsta.mpe' || {
            echo 'Published MPP is missing extensions/myinsta.mpe.' >&2
            exit 1
          }
          echo "Published MPP validated: $url"

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'MyInsta2 ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: patches/build/libs/patches-*.mpp

      - name: Verify project compiles
        if: steps.release.outputs.new_release_published != 'true'
        run: gradle :patches:buildAndroid --stacktrace
